<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista - Próximo Passo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Registros Salvos (Novo AVA)</h2>
        <a th:href="@{/proximo_passo/cadastrar}" class="btn btn-primary">Novo Cadastro</a>
    </div>
    
    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>ID Conteúdo</th>
                <th>Dificuldade</th>
                <th>Taxa de Acerto</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${lista}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.conteudo_id}"></td>
                <td th:text="${p.nivel_dificuldade}"></td>
                <td th:text="${p.taxa_acerto} + '%'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(lista)}">
                <td colspan="4" class="text-center">Nenhum registro encontrado.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
