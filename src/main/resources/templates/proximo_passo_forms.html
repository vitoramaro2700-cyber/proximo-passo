<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Próximo Passo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Cadastrar Próximo Passo</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/proximo_passo/salvar}" th:object="${proximoPasso}" method="post">
                <div class="mb-3">
                    <label class="form-label">ID do Conteúdo:</label>
                    <input type="number" th:field="*{conteudo_id}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nível de Dificuldade:</label>
                    <select th:field="*{nivel_dificuldade}" class="form-select">
                        <option value="Facil">Fácil</option>
                        <option value="Medio">Médio</option>
                        <option value="Dificil">Difícil</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Taxa de Acerto (%):</label>
                    <input type="number" step="0.01" th:field="*{taxa_acerto}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success">Salvar</button>
                <a th:href="@{/proximo_passo/listar}" class="btn btn-secondary">Ver Listagem</a>
            </form>
        </div>
    </div>
</body>
</html>
